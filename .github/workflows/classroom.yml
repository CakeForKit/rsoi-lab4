name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

#      - name: Run unit tests and vet
#        run: |
#          for module in lb-core ms-flight ms-ticket ms-bonus ms-gateway; do
#            (cd "$module" && GOWORK=off go test ./... && GOWORK=off go vet ./...)
#          done

      - name: Build images
        timeout-minutes: 10
        run: docker compose build
        env:
          DOCKER_REGISTRY: ${{ env.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}

#      - name: Run containers
#        timeout-minutes: 5
#        run: |
#          docker compose up -d
#          ./scripts/wait-script.sh
#        env:
#          WAIT_PORTS: 8080,8070,8060,8050
#          DOCKER_REGISTRY: ${{ env.DOCKERHUB_USERNAME }}
#          IMAGE_TAG: ${{ github.sha }}
#
#      - name: Install Newman
#        run: npm install --global newman
#
#      - name: Run API and failover tests
#        timeout-minutes: 5
#        run: ./scripts/test-compose.sh v1 ms-bonus 8050

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Publish images
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: docker compose push ms-flight ms-ticket ms-bonus ms-gateway
        env:
          DOCKER_REGISTRY: ${{ env.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Configure Kubernetes access
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.KUBECONFIG_B64 != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Save Kubernetes configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.KUBECONFIG_B64 != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"

      - name: Install Helm
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.KUBECONFIG_B64 != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: azure/setup-helm@v4

      - name: Deploy to Kubernetes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' && env.KUBECONFIG_B64 != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: |
          helm upgrade --install postgres helm/postgres \
            --namespace "$NAMESPACE" --create-namespace --wait --timeout 3m

          for values in helm/microservice/values-ms-*.yaml; do
            release=${values##*/values-}
            release=${release%.yaml}

            helm upgrade --install "$release" helm/microservice \
              --namespace "$NAMESPACE" --wait --timeout 3m \
              -f "$values" \
              --set image.repository="$DOCKER_REGISTRY/rsoi-lab4-$release" \
              --set image.tag="$IMAGE_TAG"
          done
        env:
          NAMESPACE: rsoi
          DOCKER_REGISTRY: ${{ env.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}

