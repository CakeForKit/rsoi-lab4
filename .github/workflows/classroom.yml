name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Run unit tests and vet
        run: |
          for module in lb-core ms-flight ms-ticket ms-bonus ms-gateway; do
            (cd "$module" && GOWORK=off go test ./... && GOWORK=off go vet ./...)
          done

      - name: Build images
        timeout-minutes: 10
        run: make build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v1/postman/collection.json
          environment: v1/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Publish images
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: make push
        env:
          DOCKER_REGISTRY: ${{ env.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Configure Kubernetes access
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.KUBECONFIG_B64 != ''
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"

      - name: Install Helm
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.KUBECONFIG_B64 != ''
        uses: azure/setup-helm@v4

      - name: Deploy to Kubernetes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' && env.KUBECONFIG_B64 != ''
        run: make deploy
        env:
          NAMESPACE: rsoi
          DOCKER_REGISTRY: ${{ env.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

#      - name: Github auto grader mark
#        uses: Romanow/google-sheet-autograder-marker@v1.0
#        with:
#          google_token: ${{secrets.GOOGLE_API_KEY}}
#          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
#          homework_number: 2
#          user_column: 'D'
#          column_offset: 'F'
#          mark: "'+"

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v
