apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.fullnameOverride }}-init
data:
  20-create-databases.sh: |
    #!/usr/bin/env bash
    set -e
    export PGPASSWORD="$POSTGRES_PASSWORD"
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 <<-EOSQL
      CREATE USER {{ .Values.auth.appUser }} WITH PASSWORD '$APP_PASSWORD';
      CREATE DATABASE flights OWNER {{ .Values.auth.appUser }};
      CREATE DATABASE tickets OWNER {{ .Values.auth.appUser }};
      CREATE DATABASE privileges OWNER {{ .Values.auth.appUser }};
    EOSQL
