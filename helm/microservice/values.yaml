nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: local/rsoi-lab4-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

env: []

healthPath: /manage/health

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingress:
  enabled: false
  className: nginx
  host: rsoi.local
  path: /
  pathType: Prefix
